<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LAZART gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="word">LAZART</span><span class="sub" id="subtitle">loading…</span></div>
  <div class="tools">
    <a class="chip x-factor" href="https://lazart-moss-gallery.netlify.app/x-factor/">X Factor</a>
    <button id="btn-favs" class="chip" title="Show only images you loved" aria-pressed="false">♥ <span id="fav-count">0</span></button>
    <button id="btn-feedback" class="chip">My feedback</button>
  </div>
</header>
<p id="vote-status" class="collection-progress meta" role="status" hidden></p>
<nav class="chips" id="collections" aria-label="Art collections"></nav>
<p id="collection-progress" class="collection-progress meta" role="status" hidden></p>
<nav class="chips" id="views" aria-label="Gallery views">
  <button class="chip on" data-view="selected">AI selections</button>
  <button class="chip" data-view="all">All reviewed</button>
  <button class="chip" data-view="ready">Ready for print</button>
</nav>
<nav class="chips" id="lanes">
  <select class="chip" id="run" aria-label="Filter by run"></select>
  <button class="chip on" data-lane="all">All lanes</button>
  <button class="chip" data-lane="safe">Safe</button>
  <button class="chip" data-lane="twist">Lazart twist</button>
</nav>
<nav class="chips" id="categories" aria-label="Categories"></nav>
<main id="grid" class="grid" aria-live="polite"></main>
<p class="foot" id="empty" hidden>No images match these filters.</p>
<p class="foot" id="foot"></p>

<div id="viewer" class="viewer" hidden>
  <button class="close" id="close" aria-label="Close">×</button>
  <button class="nav prev" id="prev" aria-label="Previous">‹</button>
  <button class="nav next" id="next" aria-label="Next">›</button>
  <figure>
    <img id="big" alt="">
    <figcaption>
      <div class="caption-head">
        <div><strong id="v-title"></strong><span id="v-meta" class="meta"></span></div>
        <div class="reactions">
          <button id="r-love" class="react" title="Like this image" aria-label="Like this image" aria-pressed="false">♡</button>
          <button id="r-more" class="react" title="More like this" aria-label="More like this" aria-pressed="false">★</button>
          <button id="r-no" class="react" title="Not for us" aria-label="Not for us" aria-pressed="false">✕</button>
        </div>
      </div>
      <p id="v-print" class="meta" role="status"></p>
      <textarea id="v-note" placeholder="Note (optional): why, which room, what to change…"></textarea>
      <details><summary>Prompt &amp; provenance</summary><pre id="v-prompt"></pre></details>
    </figcaption>
  </figure>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <h2>My feedback</h2>
    <p id="fb-info">Hearts, stars and notes are saved in this browser. Tap a heart again to unlike. Download JSON and send the file to Michael to share your feedback.</p>
    <p id="fb-count" role="status"></p>
    <input id="fb-name" placeholder="Your name or nickname" aria-label="Your name or nickname" maxlength="40">
    <div class="row">
      <button id="fb-export" class="primary">Download JSON</button>
      <button id="fb-import">Restore JSON</button>
      <input id="fb-file" type="file" accept=".json,application/json" hidden>
      <button id="fb-cancel">Done</button>
    </div>
    <p id="fb-status" class="meta" role="status"></p>
  </div>
</div>

<script src="app.js?v=personal-feedback-20261110"></script>
</body>
</html>
